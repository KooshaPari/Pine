name: Docs Validation
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Verify required docs exist
        run: |
          set -euo pipefail
          for f in README.md docs/ARCHITECTURE.md AGENTS.md; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              exit 1
            fi
          done

      - name: Check markdown links
        uses: lycheeverse/lychee-action@6da1d14f3a43098a294b7696d93d938aa8d20fc0 # v2
        with:
          args: --no-progress --exit-code README.md docs/ARCHITECTURE.md docs/PINE-MAIN-ANALYSIS.md docs/acceptance-contracts/.gitkeep
        continue-on-error: true
