name: CI

on:
  push:
    branches: [main, master, chore/**, feat/**, fix/**, refactor/**]
  pull_request:
    branches: [main, master, chore/**, feat/**, fix/**, refactor/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Lint (fmt + clippy)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build + Test
        run: |
          cargo build --workspace --all-targets
          cargo test --workspace --all-features --no-fail-fast

  secrets:
    name: TruffleHog secrets scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (full history, head only on push events)
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ""
          head: HEAD
          extraArgs: --no-history --only-verified
